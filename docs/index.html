<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Charla</title>
<meta name="description" content="Practise speaking Spanish in real situations, with corrections made for Portuguese speakers.">
<meta name="theme-color" content="#F2F2F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Charla">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div class="screen" id="tabs">
    <section class="page" id="page-home">
      <header class="nav-compact"><span>Hablar</span></header>
      <div class="page-scroll">
        <div class="large-title"><p class="eyebrow" id="homeEyebrow"></p><h1 id="homeTitle">Hola</h1></div>
        <div class="page-body" id="homeBody"></div>
      </div>
    </section>
    <section class="page" id="page-notebook" hidden>
      <header class="nav-compact"><span>Cuaderno</span></header>
      <div class="page-scroll">
        <div class="large-title"><p class="eyebrow">Tus errores y expresiones</p><h1>Cuaderno</h1></div>
        <div class="page-body" id="nbBody"></div>
      </div>
    </section>
    <section class="page" id="page-guide" hidden>
      <header class="nav-compact"><span>Guía</span></header>
      <div class="page-scroll">
        <div class="large-title"><p class="eyebrow">Para portugueses</p><h1>Guía</h1></div>
        <div class="page-body" id="guideBody"></div>
      </div>
    </section>
    <section class="page" id="page-settings" hidden>
      <header class="nav-compact"><span>Ajustes</span></header>
      <div class="page-scroll">
        <div class="large-title"><p class="eyebrow">Charla</p><h1>Ajustes</h1></div>
        <div class="page-body" id="settingsBody"></div>
      </div>
    </section>
    <nav class="tabbar" aria-label="Secciones">
      <button class="tab" data-act="tab" data-tab="home"><span data-ui="chat"></span><span>Hablar</span></button>
      <button class="tab" data-act="tab" data-tab="notebook"><span data-ui="book"></span><span>Cuaderno</span></button>
      <button class="tab" data-act="tab" data-tab="guide"><span data-ui="wave"></span><span>Guía</span></button>
      <button class="tab" data-act="tab" data-tab="settings"><span data-ui="gear"></span><span>Ajustes</span></button>
    </nav>
  </div>

  <section class="screen chat" id="chat" aria-hidden="true">
    <header class="chat-nav">
      <button class="nav-btn" data-act="back" aria-label="Volver"><span data-ui="back"></span></button>
      <div class="chat-id"><span class="avatar" id="chatAvatar"></span><div class="chat-id-text"><strong id="chatName"></strong><span id="chatRole"></span></div></div>
      <button class="nav-btn" data-act="summary" aria-label="Resumen de la conversación"><span data-ui="sparkles"></span></button>
    </header>
    <div class="chat-scroll" id="chatScroll"><div class="chat-list" id="chatList"></div></div>
    <div class="suggest" id="suggest" hidden></div>
    <footer class="dock" id="dock"></footer>
  </section>

  <section class="screen onboard" id="onboard" hidden></section>

  <div class="sheet-layer" id="sheetLayer" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div id="sheetBody"></div></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
